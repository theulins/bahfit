function calendar(){let t=new Date(),ref=new Date(t.getFullYear(),t.getMonth()+calOffset,1);let yy=ref.getFullYear(),mm=ref.getMonth(),shift=(ref.getDay()+6)%7,days=new Date(yy,mm+1,0).getDate(),html='';for(let i=0;i<7;i++)html+=`<div class="cal-header">${['S','T','Q','Q','S','S','D'][i]}</div>`;for(let i=0;i<Math.ceil((shift+days)/7)*7;i++){let day=i-shift+1,d=new Date(yy,mm,day),matches=db.sessions.filter(s=>dateKey(s.finishedAt)===dateKey(d));html+=`<button class="cal-day ${d.getMonth()!==mm?'other':''} ${matches.length?'has':''} ${dateKey(d)===dateKey(Date.now())?'today':''}" ${matches.length?`data-action="cal-open" data-date="${dateKey(d)}"`:''} aria-label="${day} ${matches.length?'treino realizado':''}">${d.getDate()}</button>`}return `<div class="calendar-head"><button class="icon-btn" data-action="cal-prev">${icon('back')}</button><strong style="font-family:var(--display)">${ref.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</strong><button class="icon-btn" data-action="cal-next">${icon('chevron')}</button></div><div class="calendar">${html}</div>`}

function finishPage(){let s=db.sessions.find(x=>x.id===storySession)||db.sessions.at(-1);if(!s)return home();let st=stats(s),records=getRecords(s);return `<div class="finish-hero"><div class="finish-icon">${icon('check')}</div><div class="eyebrow" style="color:#e2baff">VOCÊ CONSEGUIU!</div><h1 style="font-size:44px;margin-top:12px">Treino concluído, Bah!</h1><p style="color:#dcc4f0;font-size:13px">Mais um dia mostrando para si mesma do que é capaz.</p><span class="pill pill-green">${icon('sparkle')} TREINO ${s.workoutId} FINALIZADO</span></div><div class="mini-stats"><div class="mini-stat"><strong>${Math.round(st.duration/60)} min</strong><small>Duração</small></div><div class="mini-stat"><strong>${st.exercise}</strong><small>Exercícios</small></div><div class="mini-stat"><strong>${st.sets}</strong><small>Séries</small></div></div><div class="card"><div class="row space-between"><div><span class="eyebrow">VOLUME REGISTRADO</span><h2 style="margin:6px 0">${prettyNum(st.volume)} kg</h2></div><div class="stat-icon" style="height:53px;width:53px">${icon('dumbbell')}</div></div>${records.length?`<div class="divider"></div><div class="row">${icon('star')} <strong>${records.length} novo(s) recorde(s)</strong></div><p>${records.map(r=>`${r.name}: ${prettyNum(r.max)} kg`).join(' · ')}</p>`:'<p class="hint">Se houver cargas registradas, você poderá comparar seus recordes nos próximos treinos.</p>'}</div><div class="row row-wrap" style="margin-top:16px"><button class="btn btn-primary flex1" data-action="story-open" data-id="${s.id}">${icon('camera')} Criar meu Story</button><button class="btn btn-secondary" data-action="go" data-view="home">Voltar ao início</button></div>`}

function rounded(ctx,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function cropImg(ctx,im,x,y,w,h){let a=im.width/im.height,b=w/h,cw,ch,cx,cy;if(a>b){ch=im.height;cw=ch*b;cx=(im.width-cw)/2;cy=0}else{cw=im.width;ch=cw/b;cx=0;cy=(im.height-ch)/2}ctx.drawImage(im,cx,cy,cw,ch,x,y,w,h)}
function wrap(ctx,text,x,y,maxWidth,lineHeight,maxLines=3){let words=text.split(/\s+/),line='',lines=0;for(let i=0;i<words.length;i++){let t=line?line+' '+words[i]:words[i];if(ctx.measureText(t).width>maxWidth&&line){ctx.fillText(line,x,y+lines*lineHeight);lines++;line=words[i];if(lines>=maxLines)break}else line=t}if(lines<maxLines&&line)ctx.fillText(line,x,y+lines*lineHeight)}
function gradient(ctx,x0,y0,x1,y1,colors){let g=ctx.createLinearGradient(x0,y0,x1,y1);colors.forEach(([stop,c])=>g.addColorStop(stop,c));return g}
function roundFill(ctx,x,y,w,h,r,color){ctx.fillStyle=color;rounded(ctx,x,y,w,h,r);ctx.fill()}

function renderStoryCanvas(){let can=document.getElementById('story-preview');if(can)storyDraw(can)}
function storyFile(){return new Promise((resolve,reject)=>{let can=document.createElement('canvas');storyDraw(can);can.toBlob(b=>b?resolve(new File([b],`BahFit_treino_${storySession}_${storyOpts.ratio}.png`,{type:'image/png'})):reject(new Error('Não foi possível exportar')),'image/png')})}
async function downloadStory(){try{let file=await storyFile(),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Imagem PNG pronta! ✨')}catch{toast('Não foi possível gerar a imagem.')}}
async function shareStory(){try{let file=await storyFile();if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'Meu treino no BahFit'});return}await downloadStory();toast('PNG salvo. Abra o Instagram ou WhatsApp para postar.')}catch(e){if(e?.name!=='AbortError')toast('Compartilhamento indisponível. Use “Baixar cartão”.')}}
function exportBackup(){let raw=JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),blob=new Blob([raw],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`BahFit_backup_${dateKey(Date.now())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2500);toast('Backup salvo. Guarde este arquivo em segurança.')}
function importBackup(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let other=JSON.parse(reader.result);if(!Array.isArray(other.sessions)||!other.settings||typeof other.settings!=='object'||!other.overrides||!['number','undefined'].includes(typeof other.version))throw Error('Arquivo inválido');showConfirm(`Restaurar o backup com ${other.sessions.length} sessão(ões)? Isso substituirá os dados atuais deste navegador.`,()=>{db={...def(),...other,settings:{...def().settings,...other.settings},active:null,rest:null,reviewDraft:null};if(save()){view='home';render();toast('Backup restaurado com sucesso!')}})}catch{toast('O arquivo não é um backup BahFit válido.')}};reader.readAsText(file)}
function go(v){if(v==='finish'&&!storySession){v='home'}if(v==='active'&&!db.active){v='workouts'}view=v;render()}
function changeTheme(input){const boolVal=!!input.checked;if(input.id==='dark-setting')conf('dark',boolVal);if(input.id==='sound-setting')conf('sound',boolVal);if(input.id==='vibration-setting')conf('vibration',boolVal);if(input.id==='notify-setting'){if(boolVal&&canNotify()&&Notification.permission==='default'){Notification.requestPermission().then(p=>{conf('notify',p==='granted');let cur=document.getElementById('notify-setting');if(cur)cur.checked=db.settings.notify;toast(p==='granted'?'Notificações permitidas':'Notificações não autorizadas')})}else if(boolVal&&!canNotify()){input.checked=false;toast('Notificações exigem HTTPS e navegador compatível.')}else conf('notify',boolVal)}}
function action(el){let a=el.dataset.action,id=el.dataset.id,k=el.dataset.key;
switch(a){
case 'go':go(el.dataset.view);break;case 'open-work':selectedWork=id;view='workout';render();break;case 'start':startWorkout(id);break;
case 'demo':openDemo(k);break;case 'toggle-set':updateSet(+el.dataset.ex,+el.dataset.set);break;case 'add-set':{let e=db.active?.exercises[+el.dataset.ex];if(e){let l=e.sets.at(-1);e.sets.push({weight:l?.weight??'',reps:l?.reps??EX[e.key].reps,done:false,completedAt:null});save();render();document.getElementById(`ex-${e.key}`)?.scrollIntoView({block:'center'})}break}
case 'rest-skip':db.rest=null;save();floating();break;
case 'rest-plus':if(db.rest){if(db.rest.paused)db.rest.remaining+=15;else db.rest.endAt+=15000;db.rest.total+=15;save();floating()}break;
case 'rest-minus':if(db.rest){if(db.rest.paused)db.rest.remaining=Math.max(1,db.rest.remaining-15);else db.rest.endAt=Math.max(Date.now()+1000,db.rest.endAt-15000);db.rest.total=Math.max(1,db.rest.total-15);save();floating()}break;
case 'rest-pause':if(db.rest){let t=db.rest;if(t.paused){t.paused=false;t.endAt=Date.now()+t.remaining*1000}else{t.remaining=Math.max(1,Math.ceil((t.endAt-Date.now())/1000));t.paused=true}save();floating()}break;
case 'finish-start':finishStart();break;case 'discard':showConfirm('Descartar o treino em andamento? As séries desta sessão serão perdidas.',()=>{db.active=null;db.rest=null;save();view='home';render();toast('Treino descartado.')});break;
case 'modal-close':closeModal();break;case 'backdrop':closeModal();break;case 'confirm-yes':{let f=confirmAction;closeModal();f();break}
case 'rate':reviewMarks('score',+el.dataset.val);break;case 'energy':reviewMarks('energy',+el.dataset.val);break;case 'save-review':saveFinish(false);break;case 'skip-review':saveFinish(true);break;
case 'cal-prev':calOffset--;render();break;case 'cal-next':calOffset++;render();break;case 'cal-open':{let sessions=db.sessions.filter(s=>dateKey(s.finishedAt)===el.dataset.date);if(sessions.length===1){detailSession=sessions[0].id;view='session';render()}else showModal(`<h2>Treinos do dia</h2>${sessions.map(s=>`<button class="session-row" style="width:100%;color:inherit" data-action="open-session" data-id="${s.id}">Treino ${s.workoutId} · ${new Date(s.finishedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} ${icon('arrow')}</button>`).join('')}`);break}
case 'open-session':closeModal();detailSession=id;view='session';render();break;case 'delete-session':showConfirm('Excluir este registro de treino? Essa ação não poderá ser desfeita.',()=>{db.sessions=db.sessions.filter(s=>s.id!==id);save();view='history';render();toast('Registro excluído.')});break;
case 'chart-type':chartType=el.dataset.type;render();break;
case 'edit-ex':editExercise(id,k);break;case 'edit-workout':editWorkout(id);break;
case 'save-ex-edit':{let sets=Number(document.getElementById('edit-sets')?.value),reps=Number(document.getElementById('edit-reps')?.value);if(!Number.isInteger(sets)||sets<1||sets>12||!Number.isInteger(reps)||reps<1||reps>60){toast('Informe de 1 a 12 séries e de 1 a 60 repetições.');break}db.overrides[id]=db.overrides[id]||{keys:[...wkKeys(id)],cfg:{}};db.overrides[id].cfg[k]={sets,reps};save();closeModal();view='workout';selectedWork=id;render();toast('Exercício atualizado.');break}
case 'move-ex':{let arr=[...wkKeys(id)],idx=arr.indexOf(k),j=idx+Number(el.dataset.dir);if(j<0||j>=arr.length)break;[arr[idx],arr[j]]=[arr[j],arr[idx]];db.overrides[id]=db.overrides[id]||{keys:[],cfg:{}};db.overrides[id].keys=arr;save();editWorkout(id);break}
case 'append-ex':{let key=document.getElementById('add-ex-select')?.value;if(!key||!EX[key]){toast('Escolha um exercício.');break}db.overrides[id]=db.overrides[id]||{keys:[...wkKeys(id)],cfg:{}};if(!db.overrides[id].keys.includes(key))db.overrides[id].keys.push(key);save();editWorkout(id);toast('Exercício adicionado.');break}
case 'story-open':storySession=id;storyOpts={...storyOpts,photo:null};view='story';render();break;
case 'story-theme':storyOpts.theme=+el.dataset.val;render();break;case 'story-ratio':storyOpts.ratio=el.dataset.val;render();break;case 'story-no-photo':storyOpts.photo=null;render();break;
case 'story-download':downloadStory();break;case 'story-share':shareStory();break;
case 'export':exportBackup();break;case 'import':document.getElementById('import-file')?.click();break;
case 'clear-data':showConfirm('Apagar todos os treinos, histórico, avaliações e configurações salvos neste navegador? Faça um backup antes.',()=>{db=def();save();view='home';render();toast('Dados apagados.')});break;
}}
document.addEventListener('click',e=>{let a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='backdrop'&&e.target!==a)return;action(a)}});
document.addEventListener('input',e=>{let t=e.target;if(t.matches('input[data-field]')){let set=db.active?.exercises[+t.dataset.ex]?.sets[+t.dataset.set];if(!set)return;let raw=t.value.trim();set[t.dataset.field]=raw===''?'':Math.max(0,Number(raw));save()}
if(t.id==='story-text'){storyOpts.text=t.value;renderStoryCanvas()}
if(t.id==='name-setting'){db.settings.name=t.value.slice(0,28);save()}
});
document.addEventListener('change',e=>{let t=e.target;
if(t.id==='chart-exercise'){chartEx=t.value;render()}
if(t.id==='rest-setting'){conf('rest',Number(t.value));toast('Tempo de descanso atualizado.')}
if(['dark-setting','sound-setting','vibration-setting','notify-setting'].includes(t.id))changeTheme(t);
if(t.dataset.storyOpt){storyOpts[t.dataset.storyOpt]=t.checked;renderStoryCanvas()}
if(t.id==='import-file')importBackup(t.files?.[0]);
if(t.id==='story-photo'&&t.files?.[0]){let f=t.files[0];if(f.size>12*1024*1024){toast('Escolha uma foto de até 12 MB.');return}let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{storyOpts.photo=im;renderStoryCanvas();toast('Foto adicionada ao cartão!')};im.onerror=()=>toast('Não foi possível abrir esta foto.');im.src=r.result};r.readAsDataURL(f)}
});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
window.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
render();tick();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
